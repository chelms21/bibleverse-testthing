<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily & Dynamic Bible Verse</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #222;
      text-align: center;
      padding: 1em;
      background-color: #1a2a3a;
      position: relative;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }

    body.bg-loaded::after {
      opacity: 1;
    }

    #verse-container {
      max-width: 700px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 25px 35px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
      text-align: center;
      z-index: 1;
    }

    #verse {
      font-size: 1.5rem;
      line-height: 1.6;
      margin-bottom: 15px;
      font-weight: 500;
    }

    #reference {
      font-style: italic;
      color: #444;
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="verse-container">
    <div id="verse">Loading verse...</div>
    <div id="reference"></div>
  </div>

  <!-- Kept as a fallback if the API is unreachable or blocked by CORS -->
  <script src="verses.js"></script>
  <script>
    const VERSE_API_URL = "/api/daily-verse";

    // Curated high-resolution landscape images grouped by mood/theme
    const themedImages = {
      sunrise: [
        "https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1600&q=80",
        "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1600&q=80"
      ],
      sunlight: [
        "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=80",
        "https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1600&q=80"
      ],
      stars: [
        "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=80",
        "https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?auto=format&fit=crop&w=1600&q=80"
      ],
      calm: [
        "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=80",
        "https://images.unsplash.com/photo-1439066615861-d1af74d74000?auto=format&fit=crop&w=1600&q=80"
      ],
      mountain: [
        "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=80",
        "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1600&q=80"
      ],
      meadow: [
        "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80",
        "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1600&q=80"
      ],
      rock: [
        "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1600&q=80",
        "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80"
      ],
      sky: [
        "https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?auto=format&fit=crop&w=1600&q=80",
        "https://images.unsplash.com/photo-1534088568595-a066f410bcda?auto=format&fit=crop&w=1600&q=80"
      ],
      ocean: [
        "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80",
        "https://images.unsplash.com/photo-1505118380757-91f5f5632de0?auto=format&fit=crop&w=1600&q=80"
      ],
      river: [
        "https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?auto=format&fit=crop&w=1600&q=80",
        "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1600&q=80"
      ],
      path: [
        "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1600&q=80",
        "https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1600&q=80"
      ]
    };

    const defaultThemes = ["sunrise", "mountain", "meadow", "sky", "calm", "river"];

    const themeKeywords = {
      joy: "sunrise",
      rejoice: "sunrise",
      glad: "sunrise",
      hope: "sunrise",
      dawn: "sunrise",
      heart: "sunrise",
      love: "sunrise",
      light: "sunlight",
      glory: "sunlight",
      truth: "sunlight",
      shine: "sunlight",
      dark: "stars",
      darkness: "stars",
      night: "stars",
      stars: "stars",
      peace: "calm",
      rest: "calm",
      still: "calm",
      afraid: "calm",
      fear: "calm",
      comfort: "calm",
      courage: "mountain",
      courageous: "mountain",
      strength: "mountain",
      strong: "mountain",
      faith: "mountain",
      stand: "mountain",
      shepherd: "meadow",
      green: "meadow",
      grace: "meadow",
      blessed: "meadow",
      refuge: "rock",
      rock: "rock",
      fortress: "rock",
      shield: "rock",
      heavens: "sky",
      heaven: "sky",
      sky: "sky",
      earth: "sky",
      sea: "ocean",
      seas: "ocean",
      ocean: "ocean",
      waves: "ocean",
      storm: "ocean",
      water: "river",
      waters: "river",
      river: "river",
      thirst: "river",
      spirit: "river",
      path: "path",
      way: "path",
      walk: "path",
      young: "path",
      wisdom: "path"
    };

    function decodeHtmlEntities(str) {
      if (!str) return "";
      const textarea = document.createElement("textarea");
      textarea.innerHTML = str;
      return textarea.value;
    }

    function setContextualBackground(verseObject) {
      let selectedTheme = "";

      // 1. Check custom tags if using local fallback verses
      if (verseObject.tags) {
        const tagsArray = verseObject.tags.split(",");
        const candidate = tagsArray[Math.floor(Math.random() * tagsArray.length)].trim().toLowerCase();
        if (themedImages[candidate]) {
          selectedTheme = candidate;
        }
      }

      // 2. Match whole words in the verse text against themeKeywords
      if (!selectedTheme && verseObject.text) {
        for (const [word, theme] of Object.entries(themeKeywords)) {
          const regex = new RegExp(`\\b${word}\\b`, "i");
          if (regex.test(verseObject.text)) {
            selectedTheme = theme;
            break;
          }
        }
      }

      // 3. Fallback to a random scenic theme
      if (!selectedTheme) {
        selectedTheme = defaultThemes[Math.floor(Math.random() * defaultThemes.length)];
      }

      const pool = themedImages[selectedTheme] || themedImages.sunrise;
      const imageUrl = pool[Math.floor(Math.random() * pool.length)];

      document.body.classList.remove("bg-loaded");

      const imgPreloader = new Image();
      imgPreloader.src = imageUrl;

      imgPreloader.onload = function () {
        let bgStyle = document.getElementById("dynamic-bg-style");
        if (!bgStyle) {
          bgStyle = document.createElement("style");
          bgStyle.id = "dynamic-bg-style";
          document.head.appendChild(bgStyle);
        }

        bgStyle.innerHTML = `body::after { background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('${imageUrl}'); }`;
        document.body.classList.add("bg-loaded");
      };
    }

    function getFallbackVerse() {
      if (typeof VERSES !== "undefined" && Array.isArray(VERSES) && VERSES.length > 0) {
        return VERSES[Math.floor(Math.random() * VERSES.length)];
      }
      return null;
    }

    async function fetchVerseFromApi() {
      const response = await fetch(VERSE_API_URL, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`HTTP error ${response.status}`);
      }

      const data = await response.json();

      const text = data.text || data.verse || data.data?.text;
      const ref = data.ref || data.reference || data.data?.reference;

      if (!text || !ref) {
        throw new Error("Unexpected API response shape");
      }

      return { text, ref, tags: "" };
    }

    async function showVerseAndBackground() {
      let verseObj = null;

      try {
        verseObj = await fetchVerseFromApi();
      } catch (err) {
        console.warn("API fetch failed, using local fallback:", err);
        verseObj = getFallbackVerse();
      }

      if (!verseObj) {
        document.getElementById("verse").innerText = "No verses available right now.";
        return;
      }

      const decodedText = decodeHtmlEntities(verseObj.text);
      const decodedRef = decodeHtmlEntities(verseObj.ref);

      document.getElementById("verse").innerText = decodedText;
      document.getElementById("reference").innerText = decodedRef;
      setContextualBackground({ ...verseObj, text: decodedText, ref: decodedRef });
    }

    window.onload = function () {
      showVerseAndBackground();
    };
  </script>
</body>
</html>
